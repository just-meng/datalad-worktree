[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalad-worktree"
version = "0.3.0"
description = "Create nested git worktrees for DataLad datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Jiameng Wu", email = "jiameng.wu@gmail.com" },
]

[project.optional-dependencies]
datalad = ["datalad"]

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.16",
    "datalad",
    "datalad-container>=1.2.6",
]

[project.scripts]
worktree = "datalad_worktree.cli:main"

[project.entry-points."datalad.extensions"]
worktree = "datalad_worktree:command_suite"

[tool.hatch.build.targets.wheel]
packages = ["src/datalad_worktree"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pyflakes (unused imports/vars, undefined names) + pycodestyle essentials +
# pyupgrade. Deliberately not pulling in pylint/flake8-comprehensions/etc:
# this codebase checks subprocess.run().returncode by hand everywhere
# instead of check=True, which is a design choice, not a bug.
select = ["E4", "E7", "E9", "F", "UP"]
